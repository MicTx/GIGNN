[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gignn"
version = "0.1.0"
description = "Python implementation of the geographically informed graph neural network (GIGNN) for spatial simulation and prediction."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Xuankai Ma"},
  {name = "Zehua Zhang"},
  {name = "Yongze Song"}
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.6",
  "torch-geometric>=2.4",
  "matplotlib>=3.7",
  "networkx>=3.0",
]

[project.optional-dependencies]
gis = [
  "geopandas>=0.14",
  "shapely>=2.0",
]
dev = [
  "black>=25.0",
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["gignn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error",
  "ignore:.*torch_geometric\\.distributed.*deprecated.*:DeprecationWarning",
  "ignore:.*torch\\.jit\\.script.*deprecated.*:DeprecationWarning",
  "ignore:.*Requested.*fraction.*realized.*:UserWarning:gignn\\.splitting",
]
